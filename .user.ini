; PHP settings for shared hosting
; This file is read by PHP on some shared hosts when php_value
; directives in .htaccess are restricted.
; Receipt photos are shrunk in the browser first; these limits cover the fallback
; where an unshrunk phone photo (up to 10MB each) is sent straight to the server.
upload_max_filesize = 10M
post_max_size = 40M
max_file_uploads = 20
max_execution_time = 60
memory_limit = 256M
